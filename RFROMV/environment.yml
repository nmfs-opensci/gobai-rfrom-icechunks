# conda/mamba environment for the NODD batch script ../nodd.py (see README.md, "Running off-hub").
#   conda env create -f environment.yml && conda activate rfromv-nodd
# dask-core is the scheduler + array API without distributed/bokeh; the script
# uses only the threaded scheduler, so the full `dask` metapackage is not needed.
name: rfromv-nodd
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.14
  - xarray>=2025.12.0
  - dask-core>=2025.11.0
  - h5netcdf>=1.7.3
  # h5py is an optional extra of h5netcdf, not a hard dependency: without it
  # the engine has no HDF5 backend (GitHub issue #8). Pin it here, not implicitly.
  - h5py>=3.12
  - gcsfs>=2025.12.0
  - pandas>=2.3.3
  - numpy>=2.3.5
  - requests>=2.32
